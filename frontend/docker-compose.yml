version: '3.8'

name: linkedin-reverse-search-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: link-frontend
    ports:
      - "3004:3004"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  app-network:
    driver: bridge 