version: '3.8'

name: linkedin-reverse-search

x-firecrawl-common-service: &firecrawl-common-service
  build: ./firecrawl/apps/api
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  networks:
    - backend
    - app-network
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-firecrawl-common-env: &firecrawl-common-env
  REDIS_URL: ${REDIS_URL:-redis://firecrawl-redis:6379}
  REDIS_RATE_LIMIT_URL: ${REDIS_URL:-redis://firecrawl-redis:6379}
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://firecrawl-playwright-service:3000/scrape}
  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  MODEL_NAME: ${MODEL_NAME}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY}
  TEST_API_KEY: ${TEST_API_KEY}
  POSTHOG_API_KEY: ${POSTHOG_API_KEY}
  POSTHOG_HOST: ${POSTHOG_HOST}
  SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN}
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN}
  SCRAPING_BEE_API_KEY: ${SCRAPING_BEE_API_KEY}
  SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL}
  SERPER_API_KEY: ${SERPER_API_KEY}
  SEARCHAPI_API_KEY: ${SEARCHAPI_API_KEY}
  LOGGING_LEVEL: ${LOGGING_LEVEL}
  PROXY_SERVER: ${PROXY_SERVER}
  PROXY_USERNAME: ${PROXY_USERNAME}
  PROXY_PASSWORD: ${PROXY_PASSWORD}
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}

services:
  # Original LinkedIn Reverse Search services
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: link-backend
    ports:
      - "3008:3008"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./ssl:/app/ssl
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
    networks:
      - app-network
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3008"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: link-frontend
    ports:
      - "3009:3009"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      - NODE_ENV=development
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3009"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Firecrawl services
  firecrawl-playwright-service:
    build: ./firecrawl/apps/playwright-service-ts
    container_name: firecrawl-playwright-service
    environment:
      PORT: 3000
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      BLOCK_MEDIA: ${BLOCK_MEDIA}
    networks:
      - backend
      - app-network

  firecrawl-api:
    <<: *firecrawl-common-service
    build: ./firecrawl/apps/api
    container_name: firecrawl-api
    environment:
      <<: *firecrawl-common-env
      HOST: "0.0.0.0"
      PORT: ${INTERNAL_PORT:-3002}
      FLY_PROCESS_GROUP: app
    depends_on:
      - firecrawl-redis
      - firecrawl-playwright-service
    ports:
      - "3002:3002"
    command: [ "pnpm", "run", "start:production" ]

  firecrawl-worker:
    <<: *firecrawl-common-service
    build: ./firecrawl/apps/api
    container_name: firecrawl-worker
    environment:
      <<: *firecrawl-common-env
      FLY_PROCESS_GROUP: worker
    depends_on:
      - firecrawl-redis
      - firecrawl-playwright-service
      - firecrawl-api
    command: [ "pnpm", "run", "workers" ]

  firecrawl-redis:
    image: redis:alpine
    container_name: firecrawl-redis
    networks:
      - backend
      - app-network
    command: redis-server --bind 0.0.0.0

networks:
  app-network:
    driver: bridge
  backend:
    driver: bridge 