name: Auto Deploy to Kaka Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Set up working directory
        run: cd ~/Desktop/LinkedIn_Reverse_Search

      - name: Check repo exists and is clean
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search
          if [ ! -d ".git" ]; then
            echo "❌ Git repo not found in ~/Desktop/LinkedIn_Reverse_Search"
            exit 1
          fi

      - name: Pull latest changes from main
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search
          git fetch origin main
          git reset --hard origin/main

      - name: Validate Firecrawl Docker Compose file
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search/firecrawl
          docker compose config -q

      - name: Check if Firecrawl containers are running
        id: check-firecrawl
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search/firecrawl
          if [ "$(docker compose ps --services --filter "status=running" | grep -c "")" -gt 0 ]; then
            echo "firecrawl_running=true" >> $GITHUB_OUTPUT
            echo "✅ Firecrawl containers are already running - skipping rebuild"
          else
            echo "firecrawl_running=false" >> $GITHUB_OUTPUT
            echo "⚠️ Firecrawl containers are not running - will rebuild"
          fi

      - name: Stop and remove existing Firecrawl containers
        if: steps.check-firecrawl.outputs.firecrawl_running != 'true'
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search/firecrawl
          docker compose down --remove-orphans

      - name: Rebuild and launch Firecrawl services
        if: steps.check-firecrawl.outputs.firecrawl_running != 'true'
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search/firecrawl
          docker compose pull || true # don't fail if no new image
          docker compose up -d --build

      - name: Validate Main Docker Compose file
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search
          docker compose config -q

      - name: Stop and remove existing Main containers
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search
          docker compose down --remove-orphans

      - name: Rebuild and launch Main services
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search
          docker compose pull || true # don't fail if no new image
          docker compose up -d --build

      - name: Verify container health
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search
          sleep 10 # Give it a few seconds to boot up
          docker compose ps
          unhealthy=$(docker inspect --format='{{json .State.Health.Status}}' link-backend)
          if [[ "$unhealthy" != "\"healthy\"" ]]; then
            echo "❌ Backend health check failed."
            exit 1
          fi
          echo "✅ Backend is healthy."
