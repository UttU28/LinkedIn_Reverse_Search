name: Auto Deploy to Kaka Server

on:
  push:
    branches:
      - main

jobs:
  setup:
    name: Set up Repository
    runs-on: self-hosted

    steps:
      - name: Ensure Repository Directory Exists
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search
          if [ ! -d ".git" ]; then
            echo "❌ Git repository not found in ~/Desktop/LinkedIn_Reverse_Search"
            exit 1
          fi
          echo "✅ Repository exists and is clean."

      - name: Pull Latest Changes
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search
          git fetch origin main
          git reset --hard origin/main
          echo "✅ Pulled latest changes from main."

  validate-firecrawl:
    name: Validate Firecrawl Setup
    runs-on: self-hosted
    needs: setup

    steps:
      - name: Validate Firecrawl Compose File
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search/firecrawl
          docker compose config -q
          echo "✅ Firecrawl docker-compose file is valid."

      - name: Check Firecrawl Containers Running
        id: firecrawl-status
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search/firecrawl
          running=$(docker compose ps --services --filter "status=running" | grep -c "" || true)
          if [ "$running" -gt 0 ]; then
            echo "firecrawl_running=true" >> $GITHUB_OUTPUT
            echo "✅ Firecrawl containers are already running."
          else
            echo "firecrawl_running=false" >> $GITHUB_OUTPUT
            echo "⚠️ Firecrawl containers not running."
          fi

      - name: Rebuild Firecrawl Services
        if: steps.firecrawl-status.outputs.firecrawl_running == 'false'
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search/firecrawl
          docker compose down --remove-orphans
          docker compose pull || true
          docker compose up -d --build
          echo "✅ Firecrawl services rebuilt and started."

  deploy-main:
    name: Deploy Main Application
    runs-on: self-hosted
    needs: 
      - setup
      - validate-firecrawl

    steps:
      - name: Validate Main Compose File
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search
          docker compose config -q
          echo "✅ Main docker-compose file is valid."

      - name: Stop and Remove Existing Containers
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search
          docker compose down --remove-orphans
          echo "✅ Stopped and removed existing containers."

      - name: Rebuild and Launch Services
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search
          docker compose pull || true
          docker compose up -d --build
          echo "✅ Main services rebuilt and launched."

      - name: Verify Backend Health
        run: |
          cd ~/Desktop/LinkedIn_Reverse_Search
          sleep 10
          docker compose ps
          health_status=$(docker inspect --format='{{json .State.Health.Status}}' link-backend || echo "\"unhealthy\"")
          if [[ "$health_status" != "\"healthy\"" ]]; then
            echo "❌ Backend container health check failed."
            exit 1
          fi
          echo "✅ Backend is healthy."
