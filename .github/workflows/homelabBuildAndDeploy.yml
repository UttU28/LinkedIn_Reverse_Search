name: homelabBuildAndDeploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  HOMELABOPS_REPO: ${{ vars.HOMELABOPS_REPO || 'UttU28/homeLabOps' }}
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://linkitup.thatinsaneguy.com/api' }}

jobs:
  buildApi:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - name: checkoutApp
        uses: actions/checkout@v4

      - name: loginGhcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.HOMELABOPS_GIT_TOKEN }}
          logout: false

      - name: buildAndPushIfChanged
        id: build
        run: |
          ownerLower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          shortSha="${GITHUB_SHA::7}"
          image="${{ env.REGISTRY }}/${ownerLower}/linkitup-api"
          # Tag = hash of exactly what goes into this image; an existing tag means nothing changed.
          inputsHash=$( { git ls-files -s -- docker/Dockerfile.api backend; echo "args:"; } | sha256sum | cut -c1-12)
          tag="src-${inputsHash}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${image}:${tag}" >/dev/null 2>&1; then
            echo "No changes for linkitup-api — reusing ${image}:${tag}"
            exit 0
          fi
          docker build -f docker/Dockerfile.api \
            -t "${image}:${tag}" -t "${image}:${shortSha}" -t "${image}:latest" .
          docker push "${image}:${tag}"
          docker push "${image}:${shortSha}"
          docker push "${image}:latest"

  buildUi:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - name: checkoutApp
        uses: actions/checkout@v4

      - name: loginGhcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.HOMELABOPS_GIT_TOKEN }}
          logout: false

      - name: buildAndPushIfChanged
        id: build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "${VITE_FIREBASE_API_KEY}" ] || [ -z "${VITE_FIREBASE_PROJECT_ID}" ]; then
            echo "::error::Missing VITE_FIREBASE_API_KEY or VITE_FIREBASE_PROJECT_ID — add repo secrets, then re-run this workflow"
            exit 1
          fi
          ownerLower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          shortSha="${GITHUB_SHA::7}"
          image="${{ env.REGISTRY }}/${ownerLower}/linkitup-ui"
          # Build args are baked into the bundle, so they are inputs too (only their hash is used).
          argsHash=$(printf '%s\n' "${{ env.VITE_API_URL }}" "${VITE_FIREBASE_API_KEY}" "${VITE_FIREBASE_AUTH_DOMAIN}" \
            "${VITE_FIREBASE_PROJECT_ID}" "${VITE_FIREBASE_APP_ID}" "${VITE_FIREBASE_STORAGE_BUCKET}" \
            "${VITE_FIREBASE_MESSAGING_SENDER_ID}" "${VITE_STRIPE_PUBLISHABLE_KEY}" | sha256sum | cut -c1-64)
          inputsHash=$( { git ls-files -s -- docker/Dockerfile.frontend docker/nginx.frontend.conf frontend; echo "args:${argsHash}"; } | sha256sum | cut -c1-12)
          tag="src-${inputsHash}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${image}:${tag}" >/dev/null 2>&1; then
            echo "No changes for linkitup-ui — reusing ${image}:${tag}"
            exit 0
          fi
          docker build -f docker/Dockerfile.frontend \
            --build-arg "VITE_API_URL=${{ env.VITE_API_URL }}" \
            --build-arg "VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}" \
            --build-arg "VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}" \
            --build-arg "VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}" \
            --build-arg "VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}" \
            --build-arg "VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}" \
            --build-arg "VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}" \
            --build-arg "VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY}" \
            -t "${image}:${tag}" -t "${image}:${shortSha}" -t "${image}:latest" .
          docker push "${image}:${tag}"
          docker push "${image}:${shortSha}"
          docker push "${image}:latest"

  bumpGitOps:
    needs: [buildApi, buildUi]
    runs-on: self-hosted
    if: github.event_name != 'pull_request'
    steps:
      - name: validateGitOpsToken
        env:
          GIT_TOKEN: ${{ secrets.HOMELABOPS_GIT_TOKEN }}
        run: |
          if [ -z "$GIT_TOKEN" ]; then
            echo "::error::Missing HOMELABOPS_GIT_TOKEN — add it under LinkedIn_Reverse_Search → Settings → Secrets"
            exit 1
          fi

      - name: checkoutHomeLabOps
        env:
          GIT_TOKEN: ${{ secrets.HOMELABOPS_GIT_TOKEN }}
        run: |
          git clone "https://x-access-token:${GIT_TOKEN}@github.com/${{ env.HOMELABOPS_REPO }}.git" homeLabOps

      - name: updateImageTags
        working-directory: homeLabOps
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          API_TAG: ${{ needs.buildApi.outputs.tag }}
          UI_TAG: ${{ needs.buildUi.outputs.tag }}
        run: |
          ownerLower=$(echo "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')
          kustomization="apps/linkItUp/kustomization.yaml"
          # Unchanged images keep the same src-<hash> tag, so they are not redeployed.
          for pair in "linkitup-api=${API_TAG}" "linkitup-ui=${UI_TAG}"; do
            image="${pair%%=*}"
            tag="${pair#*=}"
            awk -v img="ghcr.io/${ownerLower}/${image}" -v tag="${tag}" '
              $0 ~ "name: " img { inBlock=1 }
              inBlock && $0 ~ /^[[:space:]]*newTag:/ {
                sub(/newTag:.*/, "newTag: \"" tag "\"")
                inBlock=0
              }
              { print }
            ' "${kustomization}" > "${kustomization}.tmp"
            mv "${kustomization}.tmp" "${kustomization}"
          done
          grep -A1 'name: ghcr.io' "${kustomization}"

      - name: commitAndPush
        working-directory: homeLabOps
        env:
          GIT_TOKEN: ${{ secrets.HOMELABOPS_GIT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GIT_TOKEN}@github.com/${{ env.HOMELABOPS_REPO }}.git"
          git add apps/linkItUp/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No tag changes to commit."
            exit 0
          fi
          git commit -m "chore(linkitup): deploy changed images from ${GITHUB_SHA::7}"
          git push origin HEAD
